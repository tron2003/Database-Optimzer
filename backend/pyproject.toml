[project]
name = "dbopt-backend"
version = "0.1.0"
description = "PostgreSQL monitoring and optimization API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "sse-starlette>=2.1,<3.0",
    # Real PostgreSQL grammar. The approval allowlist parses statements with
    # this rather than matching regexes, which is the difference between a
    # safety control and a speed bump.
    "pglast>=7.0,<8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39,<1.0"]
openai = ["openai>=1.54,<2.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency injection *requires* a call in the default
    # argument (`x: T = Depends(...)`, `q: int = Query(...)`). The rule is
    # correct in general and inapplicable to this framework.
    "B008",
    # `class Foo(str, Enum)` rather than `StrEnum`. Kept deliberately: these
    # enums are handed to SQLAlchemy's `Enum(...)` type and compared against
    # database values, and the explicit `str` mixin keeps that behaviour
    # obvious at the definition site.
    "UP042",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
